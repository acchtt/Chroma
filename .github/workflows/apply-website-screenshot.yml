name: Apply website screenshot

on:
  push:
    branches:
      - agent/update-website-screenshot
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-website-screenshot
          fetch-depth: 0

      - name: Decode screenshot asset
        shell: bash
        run: cat .github/update-assets/chroma-app.part* | base64 --decode > website/assets/chroma-app.webp

      - name: Validate screenshot asset
        shell: bash
        run: |
          test -s website/assets/chroma-app.webp
          file website/assets/chroma-app.webp
          file website/assets/chroma-app.webp | grep -q "Web/P image"

      - name: Update screenshot markup
        shell: python
        run: |
          from pathlib import Path

          path = Path("website/index.html")
          text = path.read_text(encoding="utf-8")
          old = '<img src="assets/chroma-app.png" alt="Chroma profile editor showing a PUBG game profile" />'
          new = '<img src="assets/chroma-app.webp" alt="Chroma game profiles and profile editor" />'
          if old not in text:
              raise SystemExit("Expected website screenshot markup was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove old and temporary files
        shell: bash
        run: |
          rm -f website/assets/chroma-app.png
          rm -f WEBSITE_SCREENSHOT_UPDATE.md
          rm -rf .github/update-assets
          rm -f .github/workflows/apply-website-screenshot.yml

      - name: Commit website screenshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update website app screenshot"
          git push origin HEAD:agent/update-website-screenshot
