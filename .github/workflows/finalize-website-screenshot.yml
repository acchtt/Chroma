name: Finalize website screenshot

on:
  push:
    branches:
      - agent/update-website-screenshot
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-website-screenshot
          fetch-depth: 0

      - name: Build screenshot hash report
        shell: bash
        run: |
          set -euo pipefail
          : > SCREENSHOT_HASHES.txt
          for file in .github/update-assets/chroma-app.part*; do
            printf '%s %s %s\n' "$(git hash-object "$file")" "$(wc -c < "$file")" "$file" >> SCREENSHOT_HASHES.txt
          done

      - name: Commit hash report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCREENSHOT_HASHES.txt
          git commit -m "Record screenshot hash diagnostics"
          git push origin HEAD:agent/update-website-screenshot
