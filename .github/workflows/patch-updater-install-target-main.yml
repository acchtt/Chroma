name: One-time updater target repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-updater-install-target-main.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'acchtt/Chroma'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Patch updater target resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Chroma.WinUI/Services/UpdateService.cs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              """        ValidateStagedUpdate(stagingDirectory);\n        EnsureInstallDirectoryWritable(AppContext.BaseDirectory);\n""",
              """        ValidateStagedUpdate(stagingDirectory);\n        string applicationPath = GetRunningApplicationPath();\n        string installationDirectory = GetVerifiedInstallationDirectory(applicationPath);\n        EnsureInstallDirectoryWritable(installationDirectory);\n""")

          replace_once(
              """        return new PreparedUpdate(\n            update.LatestVersionTag,\n            stagingDirectory,\n            installerScriptPath);\n""",
              """        return new PreparedUpdate(\n            update.LatestVersionTag,\n            stagingDirectory,\n            installerScriptPath,\n            applicationPath);\n""")

          replace_once(
              """    public static void LaunchPreparedUpdate(PreparedUpdate update)\n    {\n        string installationDirectory = Path.GetFullPath(AppContext.BaseDirectory);\n""",
              """    public static void LaunchPreparedUpdate(PreparedUpdate update)\n    {\n        string applicationPath = Path.GetFullPath(update.ApplicationPath);\n        _ = GetVerifiedInstallationDirectory(applicationPath);\n""")

          replace_once(
              """        startInfo.ArgumentList.Add(\"-InstallDirectory\");\n        startInfo.ArgumentList.Add(installationDirectory);\n""",
              """        startInfo.ArgumentList.Add(\"-ApplicationPath\");\n        startInfo.ArgumentList.Add(applicationPath);\n""")

          helper = r'''    private static string GetRunningApplicationPath()
    {
        string? processPath = Environment.ProcessPath;
        if (string.IsNullOrWhiteSpace(processPath))
        {
            using Process process = Process.GetCurrentProcess();
            processPath = process.MainModule?.FileName;
        }

        if (string.IsNullOrWhiteSpace(processPath))
        {
            throw new InvalidOperationException(
                "Chroma could not determine the path of the running executable.");
        }

        return Path.GetFullPath(processPath);
    }

    private static string GetVerifiedInstallationDirectory(string applicationPath)
    {
        string fullApplicationPath = Path.GetFullPath(applicationPath);
        if (!string.Equals(
                Path.GetFileName(fullApplicationPath),
                "Chroma.exe",
                StringComparison.OrdinalIgnoreCase) ||
            !File.Exists(fullApplicationPath))
        {
            throw new InvalidOperationException(
                "Chroma could not verify the currently running installation.");
        }

        string? installationDirectory = Path.GetDirectoryName(fullApplicationPath);
        if (string.IsNullOrWhiteSpace(installationDirectory))
        {
            throw new InvalidOperationException(
                "Chroma could not determine the installation directory.");
        }

        installationDirectory = Path.GetFullPath(installationDirectory);
        string agentPath = Path.Combine(installationDirectory, "Chroma.Agent.exe");
        if (!File.Exists(agentPath))
        {
            throw new InvalidOperationException(
                "Chroma.Agent.exe is not beside the running Chroma.exe. " +
                "The updater will not replace files in an unverified folder.");
        }

        string updatesDirectory = Path.GetFullPath(Path.Combine(
            Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
            "Chroma",
            "Updates"))
            .TrimEnd(Path.DirectorySeparatorChar) + Path.DirectorySeparatorChar;
        string installationRoot = installationDirectory
            .TrimEnd(Path.DirectorySeparatorChar) + Path.DirectorySeparatorChar;
        if (installationRoot.StartsWith(
                updatesDirectory,
                StringComparison.OrdinalIgnoreCase))
        {
            throw new InvalidOperationException(
                "Chroma is running from its temporary update folder. " +
                "Launch the installed copy before updating.");
        }

        return installationDirectory;
    }

'''
          replace_once(
              """    private static void EnsureInstallDirectoryWritable(string installationDirectory)\n""",
              helper + """    private static void EnsureInstallDirectoryWritable(string installationDirectory)\n""")

          replace_once(
              """        param(\n            [Parameter(Mandatory=$true)][string]$InstallDirectory,\n            [Parameter(Mandatory=$true)][string]$StagingDirectory,\n            [Parameter(Mandatory=$true)][int]$ApplicationPid\n        )\n\n        $ErrorActionPreference = 'Stop'\n        $install = [IO.Path]::GetFullPath($InstallDirectory)\n        $staging = [IO.Path]::GetFullPath($StagingDirectory)\n""",
              """        param(\n            [Parameter(Mandatory=$true)][string]$ApplicationPath,\n            [Parameter(Mandatory=$true)][string]$StagingDirectory,\n            [Parameter(Mandatory=$true)][int]$ApplicationPid\n        )\n\n        $ErrorActionPreference = 'Stop'\n        $application = [IO.Path]::GetFullPath($ApplicationPath)\n        if (-not [IO.Path]::GetFileName($application).Equals(\n                'Chroma.exe',\n                [StringComparison]::OrdinalIgnoreCase)) {\n            throw \"Unexpected application target: $application\"\n        }\n        $install = Split-Path -Parent $application\n        $staging = [IO.Path]::GetFullPath($StagingDirectory)\n""")

          replace_once(
              """        try {\n            \"Waiting for Chroma PID $ApplicationPid to exit.\" | Set-Content $log\n""",
              """        try {\n            \"Install target: $application\" | Set-Content $log\n            \"Staging source: $staging\" | Add-Content $log\n            if (-not (Test-Path $application -PathType Leaf)) {\n                throw \"The running Chroma executable no longer exists at $application\"\n            }\n            if (-not (Test-Path (Join-Path $install 'Chroma.Agent.exe') -PathType Leaf)) {\n                throw \"Chroma.Agent.exe is not present in the verified installation folder.\"\n            }\n            \"Waiting for Chroma PID $ApplicationPid to exit.\" | Add-Content $log\n""")

          replace_once(
              """                Copy-Item $source.FullName $destination -Force\n            }\n\n            \"Update installed successfully.\" | Add-Content $log\n            Start-Process (Join-Path $install 'Chroma.exe') -WorkingDirectory $install\n""",
              """                Copy-Item $source.FullName $destination -Force\n                $sourceHash = (Get-FileHash $source.FullName -Algorithm SHA256).Hash\n                $destinationHash = (Get-FileHash $destination -Algorithm SHA256).Hash\n                if (-not $sourceHash.Equals(\n                        $destinationHash,\n                        [StringComparison]::OrdinalIgnoreCase)) {\n                    throw \"Replacement verification failed for $relative\"\n                }\n            }\n\n            \"Installed files replaced and verified in $install.\" | Add-Content $log\n            Start-Process $application -WorkingDirectory $install\n\n            if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }\n            if (Test-Path $backup) { Remove-Item $backup -Recurse -Force }\n            Get-ChildItem $updateRoot -Filter '*.zip' -File -ErrorAction SilentlyContinue |\n                Remove-Item -Force -ErrorAction SilentlyContinue\n            \"Update installed successfully. Temporary executable copies removed.\" | Add-Content $log\n""")

          replace_once(
              """public sealed record PreparedUpdate(\n    string VersionTag,\n    string StagingDirectory,\n    string InstallerScriptPath);\n""",
              """public sealed record PreparedUpdate(\n    string VersionTag,\n    string StagingDirectory,\n    string InstallerScriptPath,\n    string ApplicationPath);\n""")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit updater repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-updater-install-target-main.yml
          git add Chroma.WinUI/Services/UpdateService.cs
          git commit -m "Fix updater installation target and cleanup"
          git push origin HEAD:main
