name: Apply updater progress dialog patch

on:
  push:
    branches:
      - agent/updater-progress-dialog

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/updater-progress-dialog
          fetch-depth: 0

      - name: Add visible updater progress dialog
        shell: python
        run: |
          from pathlib import Path

          path = Path("Chroma.WinUI/MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8")

          old = '''    private async Task InstallUpdateAsync(UpdateCheckResult update)
              {
                  UpdatesButton.IsEnabled = false;
                  UpdatesButtonText.Text = "Preparing update…";

                  var progress = new Progress<UpdateProgress>(value =>
                  {
                      UpdatesButtonText.Text = value.Percentage is double percentage
                          ? $"{value.Message} {percentage:0}%"
                          : value.Message;
                  });

                  try
                  {
                      PreparedUpdate preparedUpdate = await _updateService.PrepareUpdateAsync(
                          update,
                          progress);

                      UpdatesButtonText.Text = "Restarting…";
                      UpdateService.LaunchPreparedUpdate(preparedUpdate);
                      _forceClose = true;
                      Close();
                  }
                  catch (Exception exception)
                  {
                      UpdatesButtonText.Text = $"Update {update.LatestVersionTag}";
                      await ShowUpdateInstallErrorDialogAsync(exception, update.ReleaseUri);
                  }
              }
          '''

          new = '''    private async Task InstallUpdateAsync(UpdateCheckResult update)
              {
                  UpdatesButton.IsEnabled = false;
                  UpdatesButtonText.Text = "Preparing update…";

                  var statusText = new TextBlock
                  {
                      Text = "Preparing update…",
                      FontSize = 15,
                      FontWeight = Microsoft.UI.Text.FontWeights.SemiBold,
                      TextWrapping = TextWrapping.Wrap
                  };
                  var percentText = new TextBlock
                  {
                      Foreground = (Brush)Application.Current.Resources["TextMutedBrush"],
                      HorizontalAlignment = HorizontalAlignment.Right
                  };
                  var progressHeader = new Grid();
                  progressHeader.ColumnDefinitions.Add(new ColumnDefinition());
                  progressHeader.ColumnDefinitions.Add(new ColumnDefinition
                  {
                      Width = GridLength.Auto
                  });
                  progressHeader.Children.Add(statusText);
                  Grid.SetColumn(percentText, 1);
                  progressHeader.Children.Add(percentText);

                  var progressBar = new ProgressBar
                  {
                      Minimum = 0,
                      Maximum = 100,
                      IsIndeterminate = true,
                      HorizontalAlignment = HorizontalAlignment.Stretch
                  };
                  var detailText = new TextBlock
                  {
                      Text = $"{update.CurrentVersionTag}  →  {update.LatestVersionTag}\n" +
                             "Chroma will verify the download before replacing any files.",
                      Foreground = (Brush)Application.Current.Resources["TextMutedBrush"],
                      TextWrapping = TextWrapping.Wrap
                  };
                  var content = new StackPanel
                  {
                      Spacing = 12,
                      MinWidth = 430
                  };
                  content.Children.Add(progressHeader);
                  content.Children.Add(progressBar);
                  content.Children.Add(detailText);

                  var progressDialog = new ContentDialog
                  {
                      XamlRoot = Root.XamlRoot,
                      Title = $"Updating Chroma to {update.LatestVersionTag}",
                      Content = content
                  };
                  var dialogOperation = progressDialog.ShowAsync();
                  await Task.Yield();

                  var progress = new Progress<UpdateProgress>(value =>
                  {
                      UpdatesButtonText.Text = value.Percentage is double percentage
                          ? $"{value.Message} {percentage:0}%"
                          : value.Message;
                      statusText.Text = value.Message;

                      if (value.Percentage is double reportedPercentage)
                      {
                          double normalized = Math.Clamp(reportedPercentage, 0d, 100d);
                          progressBar.IsIndeterminate = false;
                          progressBar.Value = normalized;
                          percentText.Text = $"{normalized:0}%";
                      }
                      else
                      {
                          progressBar.IsIndeterminate = true;
                          percentText.Text = string.Empty;
                      }
                  });

                  try
                  {
                      PreparedUpdate preparedUpdate = await _updateService.PrepareUpdateAsync(
                          update,
                          progress);

                      statusText.Text = "Restarting Chroma…";
                      percentText.Text = "100%";
                      progressBar.IsIndeterminate = true;
                      UpdatesButtonText.Text = "Restarting…";
                      UpdateService.LaunchPreparedUpdate(preparedUpdate);
                      progressDialog.Hide();
                      await dialogOperation;
                      _forceClose = true;
                      Close();
                  }
                  catch (Exception exception)
                  {
                      progressDialog.Hide();
                      await dialogOperation;
                      UpdatesButtonText.Text = $"Update {update.LatestVersionTag}";
                      await ShowUpdateInstallErrorDialogAsync(exception, update.ReleaseUri);
                  }
              }
          '''

          if old not in text:
              raise SystemExit("Expected InstallUpdateAsync implementation was not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- Chroma.WinUI/MainWindow.xaml.cs; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Chroma.WinUI/MainWindow.xaml.cs
          git commit -m "Add visible updater progress dialog"
          git push origin HEAD:agent/updater-progress-dialog
