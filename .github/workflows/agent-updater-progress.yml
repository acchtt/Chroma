name: Fix updater progress detail string

on:
  push:
    branches:
      - agent/updater-progress-dialog

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/updater-progress-dialog
          fetch-depth: 0

      - name: Correct escaped newline
        shell: python
        run: |
          from pathlib import Path

          path = Path("Chroma.WinUI/MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8")
          broken = '''Text = $"{update.CurrentVersionTag}  →  {update.LatestVersionTag}
          " +'''
          fixed = r'''Text = $"{update.CurrentVersionTag}  →  {update.LatestVersionTag}\n" +'''

          if broken not in text:
              raise SystemExit("Broken updater detail string was not found")

          path.write_text(text.replace(broken, fixed, 1), encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Chroma.WinUI/MainWindow.xaml.cs
          git commit -m "Fix updater progress detail string"
          git push origin HEAD:agent/updater-progress-dialog
