name: Fix website screenshot asset

on:
  push:
    branches:
      - fix/verified-website-screenshot
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verified-website-screenshot
          fetch-depth: 0

      - name: Rebuild and verify screenshot
        shell: python
        run: |
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path
          import subprocess

          parts = [
              Path(f".github/screenshot-fix/chunk{number:02d}.b64")
              for number in range(5)
          ]
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          data = base64.b64decode(encoded, validate=True)

          output = Path("website/assets/chroma-app-v13.webp")
          output.write_bytes(data)

          expected_sha256 = "a5c4b48c64ce14d2c2eee6715371ce8b25fdcc4a945e4ae7802fbcccf7e1985f"
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"Unexpected SHA-256: {actual_sha256}")

          expected_blob = "6b90c7efc8f757632330982ba9650f3a5d32f572"
          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(output)],
              text=True,
          ).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f"Unexpected Git blob: {actual_blob}")

          if not data.startswith(b"RIFF") or data[8:12] != b"WEBP":
              raise SystemExit("Rebuilt file is not a valid WebP container")

          print(f"Verified WebP: {len(data)} bytes, SHA-256 {actual_sha256}")

      - name: Remove temporary files
        shell: bash
        run: |
          rm -rf .github/screenshot-fix
          rm -f .github/workflows/fix-website-screenshot.yml
          rm -f fix-note.txt REPAIR_READY.md

      - name: Commit repaired asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair website screenshot asset"
          git push origin HEAD:fix/verified-website-screenshot
