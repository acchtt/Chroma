name: Apply Chroma screenshot

on:
  push:
    branches: [main]
    paths:
      - '.screenshot-chunks/**'
      - '.github/workflows/apply-screenshot.yml'

permissions:
  contents: write

jobs:
  apply-png:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode PNG screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .screenshot-chunks/00.txt
          base64 --decode .screenshot-chunks/00.txt > website/assets/chroma-app.png
          file website/assets/chroma-app.png
          test "$(head -c 8 website/assets/chroma-app.png | xxd -p)" = "89504e470d0a1a0a"
          rm -rf .screenshot-chunks

      - name: Commit screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/chroma-app.png .screenshot-chunks
          git commit -m "Replace Chroma app screenshot with uploaded PNG"
          git push
