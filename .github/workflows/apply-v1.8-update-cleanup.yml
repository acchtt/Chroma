name: Apply v1.8 update cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .release-v1.8-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'release/v1.8-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cleanup and version changes
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('Chroma.WinUI/App.xaml.cs')
          app = app_path.read_text(encoding='utf-8')
          old = '''    protected override void OnLaunched(LaunchActivatedEventArgs args)\n    {\n        MainWindowInstance = new MainWindow();'''
          new = '''    protected override void OnLaunched(LaunchActivatedEventArgs args)\n    {\n        _ = UpdateService.CleanupStaleUpdateFilesAsync();\n        MainWindowInstance = new MainWindow();'''
          if old not in app:
              raise SystemExit('App launch insertion point not found')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          service_path = Path('Chroma.WinUI/Services/UpdateService.cs')
          service = service_path.read_text(encoding='utf-8')
          anchor = '''    private static readonly HttpClient Client = CreateHttpClient();\n\n'''
          cleanup_method = '''    private static readonly HttpClient Client = CreateHttpClient();\n\n    public static async Task CleanupStaleUpdateFilesAsync()\n    {\n        // Give the external updater time to finish copying, verification,\n        // rollback cleanup, and its final log write before removing artifacts.\n        await Task.Delay(TimeSpan.FromSeconds(15)).ConfigureAwait(false);\n\n        string updatesRoot = Path.Combine(\n            Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),\n            "Chroma",\n            "Updates");\n        if (!Directory.Exists(updatesRoot))\n        {\n            return;\n        }\n\n        try\n        {\n            string retainedLogPath = Path.Combine(updatesRoot, "last-update.log");\n            string? latestLogPath = Directory\n                .EnumerateFiles(updatesRoot, "update.log", SearchOption.AllDirectories)\n                .OrderByDescending(File.GetLastWriteTimeUtc)\n                .FirstOrDefault();\n\n            if (!string.IsNullOrWhiteSpace(latestLogPath) &&\n                File.Exists(latestLogPath))\n            {\n                File.Copy(latestLogPath, retainedLogPath, overwrite: true);\n            }\n\n            foreach (string directory in Directory.EnumerateDirectories(updatesRoot))\n            {\n                try\n                {\n                    Directory.Delete(directory, recursive: true);\n                }\n                catch (IOException)\n                {\n                }\n                catch (UnauthorizedAccessException)\n                {\n                }\n            }\n\n            foreach (string file in Directory.EnumerateFiles(updatesRoot))\n            {\n                if (string.Equals(\n                        Path.GetFullPath(file),\n                        Path.GetFullPath(retainedLogPath),\n                        StringComparison.OrdinalIgnoreCase))\n                {\n                    continue;\n                }\n\n                try\n                {\n                    File.Delete(file);\n                }\n                catch (IOException)\n                {\n                }\n                catch (UnauthorizedAccessException)\n                {\n                }\n            }\n        }\n        catch (IOException)\n        {\n        }\n        catch (UnauthorizedAccessException)\n        {\n        }\n    }\n\n'''
          if anchor not in service:
              raise SystemExit('UpdateService insertion point not found')
          service = service.replace(anchor, cleanup_method, 1)

          old_script = '''            if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }\n            if (Test-Path $backup) { Remove-Item $backup -Recurse -Force }\n            Get-ChildItem $updateRoot -Filter '*.zip' -File -ErrorAction SilentlyContinue |\n                Remove-Item -Force -ErrorAction SilentlyContinue\n            "Update installed successfully. Temporary executable copies removed." | Add-Content $log'''
          new_script = '''            if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }\n            if (Test-Path $backup) { Remove-Item $backup -Recurse -Force }\n            Get-ChildItem $updateRoot -Filter '*.zip' -File -ErrorAction SilentlyContinue |\n                Remove-Item -Force -ErrorAction SilentlyContinue\n\n            $updatesRoot = Split-Path -Parent $updateRoot\n            Get-ChildItem $updatesRoot -Directory -ErrorAction SilentlyContinue |\n                Where-Object {\n                    -not $_.FullName.Equals(\n                        $updateRoot,\n                        [StringComparison]::OrdinalIgnoreCase)\n                } |\n                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue\n\n            "Update installed successfully. Temporary and past update files removed." | Add-Content $log'''
          if old_script not in service:
              raise SystemExit('Installer cleanup block not found')
          service_path.write_text(service.replace(old_script, new_script, 1), encoding='utf-8')

          project_path = Path('Chroma.WinUI/Chroma.WinUI.csproj')
          project = project_path.read_text(encoding='utf-8')
          replacements = {
              '<Version>1.7.0</Version>': '<Version>1.8.0</Version>',
              '<AssemblyVersion>1.7.0.0</AssemblyVersion>': '<AssemblyVersion>1.8.0.0</AssemblyVersion>',
              '<FileVersion>1.7.0.0</FileVersion>': '<FileVersion>1.8.0.0</FileVersion>',
              '<InformationalVersion>v1.7</InformationalVersion>': '<InformationalVersion>v1.8</InformationalVersion>',
          }
          for old_text, new_text in replacements.items():
              if old_text not in project:
                  raise SystemExit(f'Missing project version token: {old_text}')
              project = project.replace(old_text, new_text, 1)
          project_path.write_text(project, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('> Current release: **v1.7**', '> Current release: **v1.8**', 1)
          feature_anchor = '- Visible updater progress for download, checksum verification, preparation, and restart\n'
          if feature_anchor not in readme:
              raise SystemExit('README feature insertion point not found')
          readme = readme.replace(
              feature_anchor,
              feature_anchor + '- Automatic removal of old update packages, staging folders, and backups after installation\n',
              1)
          readme_path.write_text(readme, encoding='utf-8')

          website_path = Path('website/index.html')
          website = website_path.read_text(encoding='utf-8')
          website = website.replace('"softwareVersion": "1.4"', '"softwareVersion": "1.8"')
          website = website.replace('Download v1.4', 'Download v1.8')
          website_path.write_text(website, encoding='utf-8')

          Path('RELEASE_NOTES_v1.8.md').write_text('''# Chroma v1.8\n\nChroma v1.8 completes the corrected automatic-update test path and adds automatic cleanup of updater artifacts.\n\n## Updated\n\n- Starts a delayed cleanup task whenever Chroma opens.\n- Preserves the newest updater log as `%LOCALAPPDATA%\\Chroma\\Updates\\last-update.log`.\n- Deletes all versioned update directories after the installer has finished.\n- Removes downloaded ZIP files, extracted staging copies, rollback backups, and obsolete updater scripts.\n- Future updater runs also remove older sibling update directories immediately after a successful installation.\n- Continues to replace and SHA-256 verify the exact folder containing the running `Chroma.exe`.\n\n## Test from v1.7\n\n1. Launch the correctly installed v1.7 copy.\n2. Accept the v1.8 update prompt.\n3. Confirm the visible progress window appears.\n4. Confirm Chroma restarts from the same folder and reports v1.8.\n5. Wait about 15 seconds.\n6. Check `%LOCALAPPDATA%\\Chroma\\Updates`; only `last-update.log` should remain.\n''', encoding='utf-8')

          Path('.release-v1.8-cleanup').unlink()

      - name: Commit v1.8 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic updater artifact cleanup for v1.8"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
